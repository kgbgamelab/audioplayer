<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genially Audio Tool</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --p-color: #9333ea; --p-scale: 1; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: transparent; height: 100%; overflow: hidden; }
        
        /* EDITOR */
        #editor { display: flex; height: 100vh; background: #111; color: #eee; overflow-y: auto; }
        .side { width: 320px; background: #1a1a1a; padding: 20px; border-right: 1px solid #333; }
        .view { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #0b0b0b; padding: 40px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; }
        button { background: #9333ea; cursor: pointer; font-weight: bold; border: none; }
        
        /* PLAYER CONTAINER (FIX FOR SHADOWS) */
        .widget-wrapper { 
            display: flex; justify-content: center; align-items: center; 
            width: 100%; height: 100%; padding: 40px; box-sizing: border-box; 
        }

        /* PLAYER */
        .player { 
            width: 580px; height: 180px; border-radius: 24px; padding: 20px; 
            display: flex; color: white; position: relative; 
            box-shadow: 0 15px 45px rgba(0,0,0,0.6); 
            transition: 0.3s; transform: scale(var(--p-scale));
            background-size: 200% 200% !important;
            animation: gradientAnim 8s ease infinite; /* Анимация перелива */
        }

        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .cover-art { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #fff; overflow: hidden; flex-shrink: 0; background: #333; z-index: 2; }
        .cover-art img { width: 100%; height: 100%; object-fit: cover; }
        .main-info { flex-grow: 1; padding-left: 20px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
        .title { font-size: 20px; font-weight: bold; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status { font-size: 13px; opacity: 0.7; margin: 4px 0 8px; }
        
        /* Визуализатор */
        .viz-container { display: flex; align-items: flex-end; gap: 2px; height: 20px; margin-bottom: 10px; }
        .viz-bar { background: rgba(255,255,255,0.5); width: 3px; border-radius: 2px; height: 3px; transition: 0.1s; }

        .progress-wrap { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; position: relative; }
        .progress-bar { height: 100%; background: #fff; border-radius: 3px; width: 0%; }
        
        .controls { display: flex; align-items: center; gap: 15px; margin-top: 15px; }
        .btn { cursor: pointer; font-size: 18px; transition: 0.2s; opacity: 0.9; }
        .btn:hover { transform: scale(1.1); opacity: 1; }

        /* Громкость */
        .vol-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .vol-slider { width: 60px !important; margin: 0; cursor: pointer; height: 4px; }

        /* Плейлист */
        #list-window {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); border-radius: 24px; z-index: 10;
            display: none; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        .list-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; font-size: 14px; }
        .list-item:hover { background: rgba(255,255,255,0.1); }
        
        body.widget #editor { display: none; }
    </style>
</head>
<body id="b">

<div id="editor">
    <div class="side">
        <h3>Настройки</h3>
        <label>Цвет темы: <input type="color" id="c" value="#9333ea"></label>
        <label>Размер (0.5 - 1.5): <input type="number" id="sc" value="1" step="0.1"></label>
        <label>GitHub путь: <input type="text" id="p" value="kgbgamelab/audioplayer/main"></label>
        <label>URL обложки: <input type="text" id="i" placeholder="https://..."></label>
        <button onclick="copyCode()">СКОПИРОВАТЬ КОД</button>
        <p id="msg" style="text-align:center; color: #888; font-size: 12px;"></p>
    </div>
    <div class="view">
        <div id="prev"></div>
    </div>
</div>

<div id="player-ui" style="display: none;">
    <div class="widget-wrapper">
        <div class="player" id="card">
            <div id="list-window">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <b>Плейлист</b> <i class="fas fa-times btn" onclick="toggleList()"></i>
                </div>
                <div id="list-content"></div>
            </div>
            <div class="cover-art"><img id="track-img" src="" alt=""></div>
            <div class="main-info">
                <p class="title" id="t">Загрузка...</p>
                <p class="status" id="s">Инициализация...</p>
                
                <div class="viz-container" id="viz"></div> <div class="progress-wrap" id="pw"><div class="progress-bar" id="pb"></div></div>
                <div class="controls">
                    <i class="fas fa-step-backward btn" onclick="change(-1)"></i>
                    <i class="fas fa-play btn" id="play-btn" style="font-size: 28px;" onclick="toggle()"></i>
                    <i class="fas fa-step-forward btn" onclick="change(1)"></i>
                    <i class="fas fa-random btn" id="shuf-btn" onclick="isShuf=!isShuf; this.style.color=isShuf?'#00f2ff':'#fff'"></i>
                    <i class="fas fa-bars btn" onclick="toggleList()"></i>
                    
                    <div class="vol-wrap">
                        <i class="fas fa-volume-up" style="font-size: 12px;"></i>
                        <input type="range" class="vol-slider" id="v" min="0" max="1" step="0.1" value="1">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<audio id="a"></audio>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const audio = document.getElementById('a');
    let tracks = [];
    let cur = 0;
    let isShuf = false;

    if (urlParams.has('w')) {
        document.body.classList.add('widget');
        document.getElementById('player-ui').style.display = 'block';
        startWidget();
    } else {
        updatePrev();
        document.querySelectorAll('input').forEach(i => i.oninput = updatePrev);
    }

    function updatePrev() {
        const color = document.getElementById('c').value;
        const scale = document.getElementById('sc').value || 1;
        const cover = document.getElementById('i').value || 'https://via.placeholder.com/150';
        const prev = document.getElementById('prev');
        prev.innerHTML = document.getElementById('player-ui').innerHTML;
        const card = prev.querySelector('#card');
        card.style.setProperty('--p-scale', scale);
        card.style.background = `linear-gradient(135deg, ${color} 0%, ${adjust(color, -30)} 50%, ${color} 100%)`;
        prev.querySelector('#track-img').src = cover;
        createViz(prev.querySelector('#viz'));
    }

    function createViz(el) {
        el.innerHTML = '';
        for(let i=0; i<30; i++) {
            const b = document.createElement('div');
            b.className = 'viz-bar';
            el.appendChild(b);
        }
    }

    function copyCode() {
        const c = encodeURIComponent(document.getElementById('c').value);
        const p = encodeURIComponent(document.getElementById('p').value);
        const i = encodeURIComponent(document.getElementById('i').value);
        const sc = document.getElementById('sc').value;
        const url = `${window.location.href.split('?')[0]}?w=1&c=${c}&p=${p}&i=${i}&sc=${sc}`;
        const code = `<iframe src="${url}" width="100%" height="300" frameborder="0" allowtransparency="true" style="background:transparent;"></iframe>`;
        navigator.clipboard.writeText(code);
        document.getElementById('msg').innerText = "КОД СКОПИРОВАН!";
    }

    async function startWidget() {
        const color = urlParams.get('c') || '#9333ea';
        const path = urlParams.get('p') || '';
        const cover = urlParams.get('i') || 'https://via.placeholder.com/150';
        const scale = urlParams.get('sc') || 1;
        
        document.getElementById('card').style.setProperty('--p-scale', scale);
        document.getElementById('card').style.background = `linear-gradient(135deg, ${color} 0%, ${adjust(color, -30)} 50%, ${color} 100%)`;
        document.getElementById('track-img').src = cover;
        createViz(document.getElementById('viz'));

        if (!path) { setStatus("Ошибка: путь не задан"); return; }

        try {
            const [u, r, b] = path.split('/');
            const res = await fetch(`https://api.github.com/repos/${u}/${r}/contents?ref=${b}`);
            const files = await res.json();
            tracks = files.filter(f => f.name.toLowerCase().endsWith('.mp3'))
                          .map(f => ({ n: f.name.replace('.mp3',''), u: f.download_url }));
            
            if (tracks.length > 0) {
                load(0);
                setStatus(`${tracks.length} треков найдено`);
                renderList();
            } else { setStatus("MP3 файлы не найдены"); }
        } catch (e) { setStatus("Ошибка доступа к GitHub"); }
    }

    function setStatus(txt) { document.getElementById('s').innerText = txt; }
    function toggleList() { const w = document.getElementById('list-window'); w.style.display = w.style.display === 'block' ? 'none' : 'block'; }

    function renderList() {
        document.getElementById('list-content').innerHTML = tracks.map((t, i) => 
            `<div class="list-item" onclick="load(${i}); toggle(); toggleList();">${t.n}</div>`
        ).join('');
    }

    function load(i) {
        cur = i;
        audio.src = tracks[i].u;
        document.getElementById('t').innerText = tracks[i].n;
        audio.load();
    }

    function toggle() {
        if (audio.paused) {
            audio.play().catch(() => {});
            document.getElementById('play-btn').className = 'fas fa-pause btn';
            animateViz(true);
        } else {
            audio.pause();
            document.getElementById('play-btn').className = 'fas fa-play btn';
            animateViz(false);
        }
    }

    function animateViz(play) {
        const bars = document.querySelectorAll('.viz-bar');
        if(!play) { bars.forEach(b => b.style.height = '3px'); return; }
        setInterval(() => {
            if(audio.paused) return;
            bars.forEach(b => {
                b.style.height = Math.random() * 20 + 3 + 'px';
            });
        }, 100);
    }

    function change(d) {
        cur = isShuf ? Math.floor(Math.random()*tracks.length) : (cur+d+tracks.length)%tracks.length;
        load(cur); toggle();
    }

    audio.ontimeupdate = () => {
        document.getElementById('pb').style.width = (audio.currentTime/audio.duration*100)+'%';
    };

    document.getElementById('pw').onclick = (e) => {
        const rect = document.getElementById('pw').getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    };

    document.getElementById('v').oninput = (e) => { audio.volume = e.target.value; };

    function adjust(hex, amt) {
        var col = hex.replace('#','');
        var res = parseInt(col,16);
        var r = (res >> 16) + amt, g = (res >> 8 & 0x00FF) + amt, b = (res & 0x0000FF) + amt;
        r = r<0?0:r>255?255:r; g = g<0?0:g>255?255:g; b = b<0?0:b>255?255:b;
        return "#" + (g | (r << 8) | (b >> 8)).toString(16).padStart(6, '0');
    }
</script>
</body>
</html>
